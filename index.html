:root{--green:#14213d;--green-deep:#0b1429;--green-soft:#e9edff;--cream:#f4f6fb;--paper:#fff;--ink:#15213b;--muted:#65718a;--line:#e2e7f0;--coral:#4669ef;--coral-soft:#edf0ff;--pistachio:#aabaff;--ui:"Assistant X",Assistant,system-ui,sans-serif;--ar:"Naskh X","Noto Naskh Arabic",serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html{background:var(--cream);scroll-behavior:smooth;scroll-padding-top:120px}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 100% -10%,#e9edff 0,transparent 36%),var(--cream);font:400 1rem/1.5 var(--ui);-webkit-tap-highlight-color:transparent}button,input,a{touch-action:manipulation}button,input{font:inherit}button{color:inherit;cursor:pointer;border:0;padding:0;background:none}button:disabled{opacity:.55;cursor:default}button svg{pointer-events:none}button:active:not(:disabled){transform:scale(.98)}a{color:inherit}svg{display:block;flex:none}h1,h2,h3,p{margin:0}[hidden]{display:none!important}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #4669ef;outline-offset:4px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip-link{position:fixed;right:12px;top:8px;z-index:200;background:var(--green);color:white;border-radius:12px;padding:12px 20px;transform:translateY(-150%)}.skip-link:focus{transform:none}
.app-shell{max-width:1180px;margin:auto;padding:calc(32px + env(safe-area-inset-top)) 36px calc(125px + env(safe-area-inset-bottom))}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px}.brand{display:flex;flex-direction:column;text-decoration:none;gap:3px}.brand-top{font-size:2.6rem;font-weight:800;letter-spacing:-1.4px;line-height:1.1;display:flex;align-items:center;gap:11px}.brand-mark{width:39px;height:39px}.brand-sub{font-size:.9rem;color:var(--muted)}.header-actions{display:flex;gap:9px}.icon-button{width:48px;height:48px;position:relative;display:grid;place-items:center;border:1px solid #dce2ef;border-radius:16px;background:#ffffffb3;box-shadow:0 4px 14px #15254704;transition:background .2s}.icon-button:hover{background:#e8edff}.icon-button svg{width:23px;height:23px}.saved-dot{width:8px;height:8px;background:#4669ef;border:2px solid white;border-radius:50%;position:absolute;left:8px;top:7px}
.hero{position:sticky;top:0;z-index:11;padding:14px 0 17px;background:linear-gradient(#f4f6fb 86%,#f4f6fb00);isolation:isolate}.hero-copy{display:flex;justify-content:space-between;align-items:baseline;gap:15px;margin-bottom:15px;flex-wrap:wrap}.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-.6px;line-height:1.25}.hero-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}.meta-separator{color:#a2adc0}.search-form{min-width:0;position:relative;background:#fff;border:1px solid #cbd4ed;border-radius:20px;box-shadow:0 8px 30px #1c377812,0 0 0 5px #fff8;transition:box-shadow .2s,border-color .2s}.search-form:focus-within{border-color:#5374ff;box-shadow:0 0 0 4px #5475ff20,0 12px 36px #23488b13}.search-form input{width:100%;background:transparent;outline:none;border:0;color:var(--ink);font-size:1.25rem;min-height:70px;padding:18px 78px 18px 51px;border-radius:20px}.search-form input::placeholder{color:#79859c;opacity:1}.search-form input::-webkit-search-cancel-button{-webkit-appearance:none}.search-icon{position:absolute;right:10px;top:9px;bottom:9px;aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(135deg,#587aff,#365ae6);border-radius:14px;color:#fff;box-shadow:0 4px 12px #3c5fea24}.search-icon svg{width:25px;height:25px}.search-clear{position:absolute;left:6px;top:13px;width:43px;height:43px;border-radius:12px;display:grid;place-items:center;color:#6c7690}.search-clear:hover{background:#eef1f9}.search-clear svg{width:19px;height:19px}body.scrolled .hero-copy{display:none}body.scrolled .hero{padding-top:10px}

    const reset=()=>{button.disabled=false;button.querySelector('span').textContent='השמעה';};
    utterance.onend=reset;utterance.onerror=event=>{reset();if(currentEntry?.id===speakingId&&event.error!=='canceled'&&event.error!=='interrupted'&&$('speechCaption'))$('speechCaption').textContent='לא ניתן להשמיע כרגע. אפשר לנסות שוב או לפתוח מקור הגייה.';};
    try{speechSynthesis.speak(utterance);}catch{reset();$('speechCaption').textContent='ההשמעה אינה זמינה כרגע.';}
  }
  function missingLoad(){
    let value=store.get(MISSING_KEY,null);
    if(!Array.isArray(value)){const legacy=store.get('milon-missing',[]);value=Array.isArray(legacy)?legacy.filter(x=>x&&typeof x.q==='string'&&x.q.trim().length>=2&&!core.hasExactMatch(x.q)).map(x=>({q:x.q,key:MilonCore.norm(x.q),count:0,firstAt:x.t||null,lastAt:x.t||null,legacy:true})):[];}
    return value.filter(x=>x&&typeof x.q==='string'&&typeof x.key==='string').slice(0,200);
  }
  function requestWord(){
    const {raw,q,tooShort}=MilonCore.queryInfo($('q').value);
    if(tooShort||!q)return;
    if(core.hasExactMatch(raw)){notify('המילה כבר נמצאת במילון. מציג את החיפוש בכל הנושאים.');category=null;mode='dictionary';updateNavigation();drawQuick();renderResults();return;}
    const list=missingLoad(),existing=list.find(x=>x.key===q),now=Date.now();
    if(existing){existing.count=(Number(existing.count)||0)+1;existing.lastAt=now;existing.legacy=false;}else list.push({q:raw,key:q,count:1,firstAt:now,lastAt:now,legacy:false});
    list.sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
    if(store.set(MISSING_KEY,list.slice(0,200)))notify('הבקשה נשמרה במכשיר. אפשר לייצא אותה בהמשך.');else notify('לא ניתן לשמור בקשה במכשיר הזה כרגע.');
  }
  function exportMissing(){const requests=missingLoad();if(!requests.length){notify('אין עדיין בקשות לייצוא.');return;}const blob=new Blob([JSON.stringify({format:'milon-missing-v2',exportedAt:new Date().toISOString(),requests},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='milon-missing.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('קובץ הבקשות מוכן להורדה.');}
  async function shareEntry(){
    const link=new URL(location.href);link.hash='entry='+encodeURIComponent(currentEntry.id);
    try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(link.href);notify('הקישור למילה הועתק.');}else if(navigator.share){await navigator.share({title:currentEntry.he,text:currentEntry.tr,url:link.href});}else notify('אפשר להעתיק את הקישור משורת הכתובת.');}catch(error){if(error.name!=='AbortError')notify('לא ניתן להעתיק כרגע. הקישור מופיע בשורת הכתובת.');}
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.save){toggleSaved(button.dataset.save);return;}
    if(button.dataset.open){const e=core.byId.get(button.dataset.open);if(e)openEntry(e);return;}
    if('category'in button.dataset){selectCategory(button.dataset.category);return;}
    if('tense'in button.dataset){detailExpanded=true;renderTense(Number(button.dataset.tense));return;}
    switch(button.dataset.action){
      case'more':appendPage();break;
      case'dictionary':changeMode('dictionary');break;
      case'global-search':changeMode('dictionary',{keepQuery:true});break;
      case'clear-filter':category=null;drawQuick();renderResults();break;
      case'request-word':requestWord();break;
      case'export-missing':exportMissing();break;
      case'close-detail':requestClose();break;
      case'expand-forms':detailExpanded=!detailExpanded;renderTense(activeTense);dialog.querySelector('[data-action="expand-forms"]')?.focus({preventScroll:true});break;
      case'speak':speak();break;
      case'share-entry':shareEntry();break;
    }
  });
  $('navDictionary').onclick=()=>{if(mode==='dictionary'){window.scrollTo({top:0,behavior:'smooth'});$('q').focus({preventScroll:true});}else changeMode('dictionary');};
  $('navCategories').onclick=()=>changeMode('categories');$('navSaved').onclick=()=>changeMode('saved');$('headerSaved').onclick=()=>changeMode('saved');
  $('brandHome').onclick=e=>{e.preventDefault();changeMode('dictionary');};
  $('allEntries').onclick=()=>{if(category)changeMode('categories');else{category=null;$('q').value='';drawQuick();renderResults();results.focus({preventScroll:true});results.scrollIntoView({behavior:'smooth',block:'start'});}};
  $('clearSearch').onclick=()=>{clearTimeout(searchTimer);$('q').value='';renderResults();$('q').focus();};
  $('q').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{renderResults();},140);});
  $('searchForm').addEventListener('submit',event=>{event.preventDefault();clearTimeout(searchTimer);renderResults();$('q').blur();});
  $('missingExport').onclick=exportMissing;
  dialog.addEventListener('cancel',event=>{event.preventDefault();requestClose();});
  dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)requestClose();}});
  dialog.addEventListener('keydown',event=>{const tab=event.target.closest('[data-tense]');if(!tab)return;const count=currentTenses.length;let next=Number(tab.dataset.tense);if(event.key==='ArrowLeft')next=(next+1)%count;else if(event.key==='ArrowRight')next=(next-1+count)%count;else if(event.key==='Home')next=0;else if(event.key==='End')next=count-1;else return;event.preventDefault();detailExpanded=true;renderTense(next);$('tenseTab'+next).focus();});
  let compactSearch=false;window.addEventListener('scroll',()=>{const y=window.scrollY;if(y>220)compactSearch=true;else if(y<60)compactSearch=false;document.body.classList.toggle('scrolled',compactSearch);$('backToTop').hidden=y<500;},{passive:true});$('backToTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
  window.addEventListener('popstate',resolveLocation);window.addEventListener('hashchange',resolveLocation);
  $('entryCount').textContent=fmt(dictionary.length)+' ערכים';renderCategories();drawQuick();updateNavigation();renderResults();syncSaved();resolveLocation();
  let installEvent=null;
  const standalone=()=>window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone===true;
  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();if(standalone())return;installEvent=event;$('install').hidden=false;});
  $('install').onclick=async()=>{if(!installEvent)return;try{await installEvent.prompt();await installEvent.userChoice;}catch{notify('אפשר להתקין את המילון דרך תפריט הדפדפן.');}installEvent=null;$('install').hidden=true;};
  window.addEventListener('appinstalled',()=>{$('install').hidden=true;installEvent=null;});
  let offlineReady=false;
  function updateOfflineStatus(){const status=$('offlineStatus');status.textContent=offlineReady?(navigator.onLine?'עובד אופליין':'במצב אופליין'):(navigator.onLine?'להג פלסטיני':'ללא חיבור לרשת');}
  window.addEventListener('online',updateOfflineStatus);window.addEventListener('offline',updateOfflineStatus);
  if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){
    let refreshed=false;const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||refreshed)return;refreshed=true;location.reload();});
    navigator.serviceWorker.register('sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;updateOfflineStatus();}).catch(()=>{offlineReady=false;updateOfflineStatus();});
  }
})();
