<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מילון ערבית מדוברת</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#123F46" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1518" media="(prefers-color-scheme: dark)">
<meta name="description" content="מילון ערבית מדוברת (להג פלסטיני) ↔ עברית. עובד אופליין.">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מילון ערבית">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">

<style>
/* ── כללי בסיס. חייבים לבוא לפני מערכת העיצוב ── */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
.pane{display:none;}
.pane:not([hidden]){display:block;}
.filters::-webkit-scrollbar{display:none;}
.root .h{color:var(--muted);font-size:.71rem;}
.empty p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.65;}
.tag.via b{font-weight:700;}
.star:active,.root:active,.act:active,.chip:active,.load-more:active{transform:scale(.97);}
#clear-btn.show{display:grid;}
.card.open .body{display:block;}
@media (min-width:761px){
  .searchbar,.meta,#results{max-width:var(--max);margin-inline:auto;}
}
</style>

<style>
/* ============================================================
   V2 — שתי כתיבות, קו אחד
   שכבת מוצר חדשה מעל מנוע המילון הקיים. ללא נכסים חיצוניים.
   ============================================================ */
:root{
  color-scheme:light;
  --canvas:#F1F4F4;
  --canvas-2:#E8EFF0;
  --surface:#FFFFFF;
  --surface-2:#F6F8F8;
  --ink:#172126;
  --muted:#66747B;
  --quiet:#8B989E;
  --border:#E0E7E8;
  --border-strong:#C8D5D8;
  --brand:#123F46;
  --brand-2:#1C6360;
  --brand-soft:#DCEDEC;
  --accent:#C98B2A;
  --accent-soft:#F5E9D2;
  --danger:#B94B4B;
  --shadow-sm:0 1px 2px rgba(17,42,47,.05),0 8px 24px rgba(17,42,47,.05);
  --shadow-md:0 2px 4px rgba(17,42,47,.06),0 18px 52px rgba(17,42,47,.12);
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:24px;
  --max:1120px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0C1518;
  --canvas-2:#101D21;
  --surface:#142328;
  --surface-2:#182A2F;
  --ink:#EDF4F4;
  --muted:#A2B1B5;
  --quiet:#71858B;
  --border:#263B41;
  --border-strong:#345057;
  --brand:#59B8B0;
  --brand-2:#76CEC6;
  --brand-soft:#18383A;
  --accent:#FFC85A;
  --accent-soft:#3A321F;
  --danger:#FF8B8B;
  --shadow-sm:0 1px 2px rgba(0,0,0,.24),0 10px 28px rgba(0,0,0,.2);
  --shadow-md:0 2px 4px rgba(0,0,0,.28),0 22px 60px rgba(0,0,0,.32);
}

html{scroll-behavior:smooth;background:var(--canvas);}
body{
  min-height:100dvh;
  background:
    radial-gradient(circle at 88% -8%, color-mix(in srgb,var(--brand-2) 12%,transparent) 0,transparent 35rem),
    var(--canvas);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
  line-height:1.5;
}
body.filters-open{overflow:hidden;}
button,input{font:inherit;}
button{-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
.arabic{
  font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic","Noto Sans Arabic","Segoe UI",sans-serif;
}
.skip-link{
  position:fixed;inset-block-start:8px;inset-inline-start:8px;z-index:200;
  transform:translateY(-150%);padding:10px 14px;border-radius:10px;
  background:var(--accent);color:#172126;font-weight:800;text-decoration:none;
}
.skip-link:focus{transform:none;}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}

/* Brand canopy */
.app-header{
  position:relative;overflow:hidden;display:block;
  background:linear-gradient(135deg,#123F46 0%,#0D3339 62%,#0A2B30 100%);
  color:#F7FAFA;
  padding:calc(18px + env(safe-area-inset-top)) 18px 49px;
}
html[data-theme="dark"] .app-header{background:linear-gradient(135deg,#102A30,#0B2025);border:0;}
.app-header::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 88% -20%,rgba(201,139,42,.20),transparent 58%);
}
.app-header::before{
  content:"";position:absolute;inset-block-end:0;inset-inline:0;height:1px;pointer-events:none;
  background:linear-gradient(to left,transparent,rgba(255,255,255,.16),transparent);
}
.header-inner{
  position:relative;z-index:1;max-width:var(--max);margin:auto;
  display:flex;align-items:center;gap:14px;
}
.brand-mark{
  width:56px;height:56px;flex:none;border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.26);
}
.brand-copy{min-width:0;flex:1;}
.eyebrow{
  display:flex;align-items:center;gap:7px;margin:0 0 3px;
  color:#B9D0D2;font-size:.72rem;font-weight:600;letter-spacing:.08em;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(242,181,68,.15);}
.brand-copy h1{margin:0;font-size:clamp(1.14rem,3vw,1.42rem);font-weight:800;letter-spacing:-.035em;}
.brand-copy p{margin:2px 0 0;color:#B9CBCE;font-size:.79rem;font-weight:400;}
.header-actions{display:flex;align-items:center;gap:8px;}
.icon-btn,.install-btn{
  height:42px;border:1px solid rgba(255,255,255,.16);border-radius:13px;
  background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .16s,background .16s,border-color .16s;
}
#theme-btn.icon-btn{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;}
html[data-theme="dark"] #theme-btn.icon-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;}
.icon-btn{width:42px;padding:0;}
.icon-btn svg,.search-icon svg,.utility-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.install-btn{padding:0 14px;color:#172126;background:var(--accent);border-color:var(--accent);font-size:.8rem;font-weight:800;}
.icon-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26);}
.icon-btn:active,.install-btn:active,.utility-btn:active{transform:scale(.95);}
.theme-sun{display:none;}.theme-moon{display:block;}
html[data-theme="dark"] .theme-sun{display:block;}html[data-theme="dark"] .theme-moon{display:none;}

/* Search command dock */
.searchbar{
  position:sticky;top:0;z-index:40;max-width:var(--max);margin:-27px auto 0;
  padding:0 14px;background:transparent;border:0;box-shadow:none;
}
.searchbar.stuck{border:0;box-shadow:none;}
.search-dock{
  padding:10px;border:1px solid color-mix(in srgb,var(--border) 82%,transparent);
  border-radius:22px;background:color-mix(in srgb,var(--surface) 94%,transparent);
  box-shadow:var(--shadow-md);backdrop-filter:blur(18px);
}
.search-row{display:flex;align-items:center;gap:8px;}
.field{position:relative;display:flex;align-items:center;flex:1;min-width:0;}
.search-icon{position:absolute;inset-inline-start:16px;color:var(--brand-2);display:grid;place-items:center;pointer-events:none;}
#search{
  width:100%;height:54px;padding:0 48px 0 46px;
  border:1.5px solid transparent;border-radius:15px;
  background:var(--surface-2);color:var(--ink);font-size:1rem;font-weight:500;
  transition:border-color .16s,box-shadow .16s,background .16s;
}
#search::placeholder{color:var(--quiet);font-weight:400;}
#search:focus{outline:0;border-color:var(--brand-2);background:var(--surface);box-shadow:0 0 0 4px var(--brand-soft);}
#clear-btn{
  position:absolute;inset-inline-end:9px;inset-inline-start:auto;width:36px;height:36px;
  border:0;border-radius:11px;background:var(--canvas-2);color:var(--muted);cursor:pointer;
  align-items:center;justify-content:center;font-size:0;
}
#clear-btn::before,#clear-btn::after{content:"";position:absolute;width:14px;height:2px;border-radius:2px;background:currentColor;transform:rotate(45deg);}
#clear-btn::after{transform:rotate(-45deg);}
.utility-btn{
  flex:none;height:54px;padding:0 15px;border:1.5px solid var(--border);border-radius:15px;
  background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  font-size:.83rem;font-weight:600;transition:transform .16s,border-color .16s,background .16s;
}
.utility-btn:hover{border-color:var(--brand-2);background:var(--brand-soft);}
.utility-btn .badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--canvas-2);color:var(--muted);font-size:.68rem;}
.utility-btn.on{background:var(--brand);border-color:var(--brand);color:#fff;}

/* Work surface */
.workspace{
  width:min(var(--max),calc(100% - 28px));margin:22px auto 0;
  display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start;
}
.filter-backdrop{display:none;}
.filter-panel{
  position:sticky;top:92px;max-height:calc(100dvh - 110px);overflow:hidden;
  border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.filter-head{padding:18px 18px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.filter-head h2{margin:0;font-size:.96rem;font-weight:600;letter-spacing:-.02em;}
.filter-head p{margin:2px 0 0;color:var(--muted);font-size:.72rem;}
.close-filters{display:none;width:38px;height:38px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--ink);cursor:pointer;}
.filters{
  max-width:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:4px;
  overflow-y:auto;overflow-x:hidden;max-height:calc(100dvh - 200px);scrollbar-width:thin;
}
.chip{
  width:100%;min-height:42px;padding:9px 11px;border:1px solid transparent;border-radius:11px;
  background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:.8rem;font-weight:500;text-align:start;white-space:normal;
}
.chip:hover{background:var(--surface-2);color:var(--ink);}
.chip.on{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand-2) 28%,transparent);color:var(--brand-2);}
html[data-theme="dark"] .chip.on{color:var(--brand-2);}
html[data-theme="dark"] .chip.on{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand-2) 28%,transparent);}
.chip .n{opacity:1;min-width:30px;padding:2px 7px;border-radius:999px;background:var(--canvas-2);color:var(--muted);font-size:.67rem;text-align:center;margin:0;}
.chip.on .n{background:var(--surface);color:var(--brand-2);}

.results-panel{min-width:0;}
.meta{
  max-width:none;margin:0;padding:4px 4px 12px;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;font-size:.78rem;
}
.meta::before{content:"תוצאות";color:var(--ink);font-size:.93rem;font-weight:600;letter-spacing:-.02em;}
#stats{font-variant-numeric:tabular-nums;}
#results{max-width:none;margin:0;padding:0 0 calc(50px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:11px;}

/* Lexical cards */
.card{
  position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-lg);
  background:var(--surface);box-shadow:var(--shadow-sm);
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:transparent;transition:background .18s;}
.card:hover{border-color:var(--border-strong);transform:translateY(-1px);}
.card.open{border-color:color-mix(in srgb,var(--brand-2) 48%,var(--border));box-shadow:var(--shadow-md);transform:none;}
.card.open::before{background:var(--brand-2);}
.summary{position:relative;}
.head{
  padding:20px 68px 19px 20px;width:100%;border:0;background:transparent;color:inherit;
  cursor:pointer;display:block;text-align:start;
}
.top{display:flex;align-items:flex-start;gap:12px;}
.word{
  flex:1;min-width:0;color:var(--ink);font-size:clamp(2.15rem,7vw,2.85rem);
  line-height:1.22;font-weight:700;letter-spacing:0;word-break:break-word;
}
.star{
  position:absolute;inset-block-start:17px;inset-inline-end:17px;width:40px;height:40px;margin:0;
  border:1px solid var(--border);border-radius:13px;background:var(--surface-2);color:var(--quiet);
  cursor:pointer;display:grid;place-items:center;font-size:1.15rem;line-height:1;
}
.star:hover{border-color:var(--accent);color:#B97908;background:var(--accent-soft);}
.star.on{border-color:color-mix(in srgb,var(--accent) 70%,var(--border));background:var(--accent-soft);color:#B97908;}
html[data-theme="dark"] .star.on,html[data-theme="dark"] .star:hover{color:var(--accent);}
.bridge{display:flex;align-items:center;gap:10px;margin:12px 0 11px;min-width:0;}
.bridge .tr{color:var(--brand-2);font-size:.94rem;font-weight:600;letter-spacing:.018em;white-space:nowrap;}
.bridge .rule{height:1px;flex:1;background:linear-gradient(to left,color-mix(in srgb,var(--brand-2) 34%,transparent),transparent);}
.gloss{color:var(--ink);font-size:1.09rem;line-height:1.5;font-weight:400;}
.tags{display:flex;align-items:center;gap:6px;margin-top:11px;flex-wrap:wrap;}
.tag{padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:.67rem;font-weight:500;letter-spacing:0;}
.tag.verb{background:var(--brand-soft);color:var(--brand-2);}
.tag.via{background:var(--accent-soft);color:#8A5905;font-weight:600;}
html[data-theme="dark"] .tag.via{color:var(--accent);}
.caret{
  position:absolute;inset-inline-end:22px;inset-inline-start:auto;inset-block-end:19px;
  width:24px;height:24px;border-radius:8px;background:var(--canvas-2);color:var(--muted);
  display:grid;place-items:center;font-size:.58rem;transition:transform .18s,color .18s;
}
.card.open .caret{transform:rotate(180deg);color:var(--brand-2);}

.body{display:block;padding:2px 20px 22px;border-top:1px solid var(--border);background:var(--surface);}
.sec{margin-top:18px;}
.sec-label{margin-bottom:10px;color:var(--quiet);font-size:.68rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase;}
.ex{padding:14px 16px;margin-bottom:7px;border:0;border-inline-start:3px solid var(--accent);border-radius:4px 13px 13px 4px;background:var(--canvas-2);}
.ex .a{color:var(--ink);font-size:1.22rem;font-weight:500;}
.ex .h{margin-top:4px;color:var(--muted);font-size:.86rem;}
.tabs{display:flex;gap:4px;padding:4px;margin-bottom:11px;border:0;border-radius:13px;background:var(--canvas-2);}
.tab{min-height:40px;padding:7px 10px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;}
.tab.on{background:var(--surface);color:var(--brand-2);box-shadow:0 2px 9px rgba(17,42,47,.09);}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
.cell{min-height:58px;padding:9px 12px;border:0;border-radius:12px;background:var(--canvas-2);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cell .p{color:var(--quiet);font-size:.68rem;font-weight:500;white-space:nowrap;}
.cell .f{text-align:end;min-width:0;}
.cell .f .a{display:block;color:var(--ink);font-size:1.08rem;font-weight:500;}
.cell .f .t{display:block;color:var(--brand-2);font-size:.67rem;font-weight:500;letter-spacing:0;}
.roots{display:flex;gap:7px;flex-wrap:wrap;}
.root{min-height:42px;padding:7px 12px;border:0;border-radius:999px;background:var(--canvas-2);color:var(--ink);display:flex;align-items:center;gap:8px;font-size:.78rem;cursor:pointer;transition:background .16s;}
.root:hover{background:var(--brand-soft);}
.root .a{font-size:1.06rem;font-weight:700;}.root .h{color:var(--muted);font-size:.71rem;}
.root-key{padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand-2);font-size:.74rem;font-weight:800;}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:19px;}
.act{min-height:44px;padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;font-size:.75rem;font-weight:600;cursor:pointer;}
.act:hover{border-color:var(--brand-2);color:var(--brand-2);background:var(--brand-soft);}
.act.primary{border-color:var(--brand);background:var(--brand);color:#fff;}
html[data-theme="dark"] .act.primary{border-color:var(--brand-2);background:var(--brand-2);color:#0C1518;}
.load-more{min-height:54px;margin-top:2px;padding:13px;border:1.5px solid var(--border-strong);border-radius:16px;background:var(--surface);color:var(--brand-2);font-size:.84rem;font-weight:800;cursor:pointer;}
.load-more:hover{border-color:var(--brand-2);background:var(--brand-soft);}
.empty{padding:64px 24px;border:1px dashed var(--border-strong);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--surface) 72%,transparent);text-align:center;}
.empty .big{width:54px;height:54px;margin:auto;border-radius:18px;background:var(--brand-soft);color:var(--brand-2);display:grid;place-items:center;font-size:1.8rem;font-weight:700;opacity:1;}
.empty h3{margin:15px 0 5px;color:var(--ink);font-size:1.05rem;}.empty p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.65;}

@media (max-width:760px){
  .app-header{padding-inline:15px;padding-bottom:48px;}
  .brand-mark{width:52px;height:52px;border-radius:15px;}
  .eyebrow{font-size:.66rem;}.brand-copy h1{font-size:1.05rem;}.brand-copy p{font-size:.71rem;}
  .install-btn{position:fixed;inset-inline:14px auto;bottom:calc(14px + env(safe-area-inset-bottom));z-index:70;box-shadow:var(--shadow-md);}
  .searchbar{padding-inline:10px;margin-top:-27px;}
  .search-dock{padding:8px;border-radius:19px;}
  .search-row{display:grid;grid-template-columns:1fr auto auto;gap:7px;}
  #search{height:52px;font-size:.93rem;}
  .utility-btn{width:52px;height:52px;padding:0;justify-content:center;}
  .utility-btn .label{display:none;}
  .utility-btn .badge{position:absolute;margin:-33px -33px 0 0;border:2px solid var(--surface);}
  .workspace{display:block;width:min(100% - 20px,720px);margin-top:15px;}
  .filter-backdrop{position:fixed;inset:0;z-index:89;background:rgba(3,13,16,.54);backdrop-filter:blur(3px);}
  .filter-backdrop.show{display:block;}
  .filter-panel{
    position:fixed;z-index:90;inset:auto 8px 8px;max-height:min(78dvh,680px);
    border-radius:25px;transform:translateY(calc(100% + 20px));opacity:0;visibility:hidden;
    transition:transform .22s ease,opacity .18s,visibility .22s;
  }
  .filter-panel.show{transform:none;opacity:1;visibility:visible;}
  .filter-head{padding:17px 17px 12px;}.close-filters{display:grid;place-items:center;}
  .filters{max-height:calc(min(78dvh,680px) - 78px);display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 10px calc(12px + env(safe-area-inset-bottom));}
  .chip{min-height:46px;border-color:var(--border);background:var(--surface-2);font-size:.75rem;}
  .meta{padding-inline:4px;}
  .card{border-radius:20px;}
  .head{padding:17px 60px 16px 16px;}
  .star{inset-block-start:15px;inset-inline-end:14px;width:38px;height:38px;}
  .caret{inset-inline-end:17px;inset-block-end:16px;}
  .word{font-size:2.18rem;}
  .body{padding:0 15px 16px;}
  .grid{grid-template-columns:1fr;}
  .acts{grid-template-columns:1fr 1fr;}.act.primary{grid-column:1/-1;}
}
@media (max-width:420px){
  .brand-copy p{display:none;}
  .filters{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}

/* ── שכבת ליטוש ─────────────────────────────────────────── */
html[data-theme="dark"] .cell,
html[data-theme="dark"] .root,
html[data-theme="dark"] .ex,
html[data-theme="dark"] .tabs{background:rgba(255,255,255,.045);}

{"ar":"طار","tr":"טַאר","he":"עף, טס","cat":"פעלים - נטיות","conj":[{"p":"אני","ar":"طرت","tr":"טִרֶת"},{"p":"אתה","ar":"طرت","tr":"טִרֶת"},{"p":"את","ar":"طرتي","tr":"טִרְתִי"},{"p":"הוא","ar":"طار","tr":"טַאר"},{"p":"היא","ar":"طارت","tr":"טַארַת"},{"p":"אנחנו","ar":"طرنا","tr":"טִרְנַא"},{"p":"אתם","ar":"طرتو","tr":"טִרְתוּ"},{"p":"הם","ar":"طاروا","tr":"טַארוּ"}],"pres":[{"p":"אני","ar":"بطير","tr":"בַּטִיר"},{"p":"אתה","ar":"بتطير","tr":"בִּתְטִיר"},{"p":"את","ar":"بتطيري","tr":"בִּתְטִירִי"},{"p":"הוא","ar":"بيطير","tr":"בִּיטִיר"},{"p":"היא","ar":"بتطير","tr":"בִּתְטִיר"},{"p":"אנחנו","ar":"بنطير","tr":"בִּנְטִיר"},{"p":"אתם","ar":"بتطيروا","tr":"בִּתְטִירוּ"},{"p":"הם","ar":"بيطيروا","tr":"בִּיטִירוּ"}],"imp":[{"p":"אתה","ar":"طير","tr":"טִיר"},{"p":"את","ar":"طيري","tr":"טִירִי"},{"p":"אתם","ar":"طيروا","tr":"טִירוּ"}]},
{"ar":"خاف","tr":"חַ'אף","he":"פחד","cat":"פעלים - נטיות","conj":[{"p":"אני","ar":"خفت","tr":"חִ'פֶת"},{"p":"אתה","ar":"خفت","tr":"חִ'פֶת"},{"p":"את","ar":"خفتي","tr":"חִ'פְתִי"},{"p":"הוא","ar":"خاف","tr":"חַ'אף"},{"p":"היא","ar":"خافت","tr":"חַ'אפַת"},{"p":"אנחנו","ar":"خفنا","tr":"חִ'פְנַא"},{"p":"אתם","ar":"خفتو","tr":"חִ'פְתוּ"},{"p":"הם","ar":"خافوا","tr":"חַ'אפוּ"}],"pres":[{"p":"אני","ar":"بخاف","tr":"בַּחַ'אף"},{"p":"אתה","ar":"بتخاف","tr":"בִּתְחַ'אף"},{"p":"את","ar":"بتخافي","tr":"בִּתְחַ'אפִי"},{"p":"הוא","ar":"بيخاف","tr":"בִּיחַ'אף"},{"p":"היא","ar":"بتخاف","tr":"בִּתְחַ'אף"},{"p":"אנחנו","ar":"بنخاف","tr":"בִּנְחַ'אף"},{"p":"אתם","ar":"بتخافوا","tr":"בִּתְחַ'אפוּ"},{"p":"הם","ar":"بيخافوا","tr":"בִּיחַ'אפוּ"}],"imp":[{"p":"אתה","ar":"خاف","tr":"חַ'אף"},{"p":"את","ar":"خافي","tr":"חַ'אפִי"},{"p":"אתם","ar":"خافوا","tr":"חַ'אפוּ"}]},
{"ar":"سبح","tr":"סַבַּח","he":"שחה","cat":"פעלים - נטיות","conj":[{"p":"אני","ar":"سبحت","tr":"סַבַּחֶת"},{"p":"אתה","ar":"سبحت","tr":"סַבַּחֶת"},{"p":"את","ar":"سبحتي","tr":"סַבַּחְתִי"},{"p":"הוא","ar":"سبح","tr":"סַבַּח"},{"p":"היא","ar":"سبحت","tr":"סַבְּחַת"},{"p":"אנחנו","ar":"سبحنا","tr":"סַבַּחְנַא"},{"p":"אתם","ar":"سبحتو","tr":"סַבַּחְתוּ"},{"p":"הם","ar":"سبحوا","tr":"סַבְּחוּ"}],"pres":[{"p":"אני","ar":"بسبح","tr":"בַּסְבַּח"},{"p":"אתה","ar":"بتسبح","tr":"בְּתִסְבַּח"},{"p":"את","ar":"بتسبحي","tr":"בְּתִסְבְּחִי"},{"p":"הוא","ar":"بيسبح","tr":"בִּיסְבַּח"},{"p":"היא","ar":"بتسبح","tr":"בְּתִסְבַּח"},{"p":"אנחנו","ar":"بنسبح","tr":"בְּנִסְבַּח"},{"p":"אתם","ar":"بتسبحوا","tr":"בְּתִסְבְּחוּ"},{"p":"הם","ar":"بيسبحوا","tr":"בִּיסְבְּחוּ"}],"imp":[{"p":"אתה","ar":"اسبح","tr":"אִסְבַּח"},{"p":"את","ar":"اسبحي","tr":"אִסְבְּחִי"},{"p":"אתם","ar":"اسبحوا","tr":"אִסְבְּחוּ"}]}
];

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const resultsEl = $('results'), searchEl = $('search'),
      filtersEl = $('filters'), statsEl = $('stats'), searchbar = $('searchbar');

/* ===== אחסון: מועדפים ומצב תצוגה =====
   עטוף ב-try/catch — בהקשרים מסוימים (iframe מוגבל, מצב פרטי)
   האחסון חסום. במקרה כזה הכל עדיין עובד, פשוט לא נשמר בין הפעלות. */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
             catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ===== מצב תצוגה ===== */
const themeBtn = $('theme-btn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.setAttribute('aria-label', t === 'dark' ? 'מעבר למצב בהיר' : 'מעבר למצב כהה');
}
const prefersDark = window.matchMedia
  ? matchMedia('(prefers-color-scheme: dark)').matches : false;
applyTheme(store.get('theme', prefersDark ? 'dark' : 'light'));
themeBtn.onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
};

/* ===== מועדפים ===== */
let favs = new Set(store.get('favs', []));
const saveFavs = () => store.set('favs', [...favs]);

/* ===== נרמול וחיפוש ===== */
function normalize(s){
  return (s || '').toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g,'')     // ניקוד ערבי + תאטוילה
    .replace(/[\u0591-\u05C7]/g,'')           // ניקוד עברי
    .replace(/[\u0623\u0625\u0622]/g,'\u0627')// אלף עם המזה ← אלף
    .replace(/\u0649/g,'\u064a')              // אלף מקצורה ← יא
    .replace(/\u0629/g,'\u0647');             // תא מרבוטה ← הא
}

/* אינדקס נבנה פעם אחת: כולל כל הצורות הנטויות ומשפטי הדוגמה */
const INDEX = new Map();
DICTIONARY.forEach(w => {
  const p = [{t:w.ar},{t:w.tr},{t:w.he}];
  (w.ex   || []).forEach(e => p.push({t:e.ar, l:'משפט לדוגמה'}, {t:e.he, l:'משפט לדוגמה'}));
  (w.conj || []).forEach(c => p.push({t:c.ar, l:'עבר · '   + c.p}, {t:c.tr, l:'עבר · '   + c.p}));
  (w.pres || []).forEach(c => p.push({t:c.ar, l:'הווה · '  + c.p}, {t:c.tr, l:'הווה · '  + c.p}));
  (w.imp  || []).forEach(c => p.push({t:c.ar, l:'ציווי · ' + c.p}, {t:c.tr, l:'ציווי · ' + c.p}));
  INDEX.set(w, p.filter(x => x.t).map(x => ({n:normalize(x.t), t:x.t, l:x.l || null})));
});

function matchInfo(w, q){
  if(!q) return {hit:true, via:null};
  q = normalize(q);
  if(!q) return {hit:true, via:null};
  let via = null;
  for(const p of INDEX.get(w) || []){
    if(p.n.includes(q)){
      if(!p.l) return {hit:true, via:null};   // התאמה בשדה ראשי
      if(!via) via = p;                        // התאמה בצורה נטויה
    }
  }
  return via ? {hit:true, via} : {hit:false, via:null};
}

/* ===== זיהוי שורשים (משוער) ===== */
const STOP = new Set("في من على عن مع الى إلى هذا هذه هو هي هم انا أنا انت إنت احنا إحنا انتو اللي شو مين وين ليش كيف بس و او أو لا ما مش لكن يعني كمان كل بعد قبل عند بين لما اذا إذا يا هيك هون هناك".split(/\s+/));
const BLOCK = new Set(["مكتئب","مرتبك","كنيسة","شيكل","شكله","دولاب","بنطلون","بلكونة","مكرونة","صالون","دركسون","فرامل","كرتونة","بنزين","دزينة","باطون","جرافة","ماشي","تلاتين"]);

function guessRoot(word){
  let s = (word || '').replace(/[\u064B-\u0652\u0640]/g,'').trim();
  if(!s || s.includes(' ') || STOP.has(s) || BLOCK.has(s)) return null;
  s = s.replace(/^(وال|بال|كال|فال|ال)/,'')
       .replace(/^(مست|است|مت|مو|مب|م|ت|ي|ن|أ|إ|ا)/,'')
       .replace(/(تها|هما|كما|نا|ها|هم|كم|ك|ه|ي|ت|وا|و|ن|ة|ات|ين|ون|ية|ي)$/,'')
       .replace(/[اويأإآئؤى]/g,'');
  return s.length < 3 ? null : s.slice(0,4);
}
const ROOTS = {};
DICTIONARY.forEach(w => { const r = guessRoot(w.ar); if(r) (ROOTS[r] = ROOTS[r] || []).push(w); });
function related(w){
  const r = guessRoot(w.ar);
  if(!r) return {root:null, list:[]};
  return {root:r, list:(ROOTS[r] || []).filter(x => x !== w && x.ar !== w.ar).slice(0,8)};
}

/* ===== מסנני קטגוריה ===== */
const COUNTS = {};
DICTIONARY.forEach(w => COUNTS[w.cat] = (COUNTS[w.cat] || 0) + 1);
const CATS = Object.keys(COUNTS).sort((a,b) => COUNTS[b] - COUNTS[a]);
let activeCat = null;      // null = הכל, '★' = מועדפים

function renderFilters(){
  filtersEl.innerHTML = '';
  const add = (label, key, n) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (activeCat === key ? ' on' : '');
    b.setAttribute('aria-pressed', activeCat === key ? 'true' : 'false');
    const text = document.createElement('span');
    text.textContent = label;
    b.appendChild(text);
    if(n != null){
      const count = document.createElement('span');
      count.className = 'n';
      count.textContent = n.toLocaleString('he-IL');
      b.appendChild(count);
    }
    b.onclick = () => {
      activeCat = (activeCat === key && key !== null) ? null : key;
      renderFilters(); render(); closeFilters();
    };
    filtersEl.appendChild(b);
  };
  add('הכל', null, DICTIONARY.length);
  add('מועדפים', '★', favs.size);
  CATS.forEach(c => add(c, c, COUNTS[c]));
  $('fav-count').textContent = favs.size.toLocaleString('he-IL');
  $('fav-btn').classList.toggle('on', activeCat === '★');
  $('fav-btn').setAttribute('aria-pressed', activeCat === '★' ? 'true' : 'false');
}

/* ===== רינדור ===== */
const PAGE = 48;
let list = [], shown = 0, q = '';

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  q = searchEl.value.trim();
  $('clear-btn').classList.toggle('show', !!q);

  list = DICTIONARY.filter(w => matchInfo(w, q).hit);
  if(activeCat === '★')      list = list.filter(w => favs.has(w.ar));
  else if(activeCat)         list = list.filter(w => w.cat === activeCat);

  resultsEl.innerHTML = ''; shown = 0;

  if(!list.length){
    statsEl.textContent = '';
    resultsEl.innerHTML = activeCat === '★'
      ? '<div class="empty"><div class="big">★</div><h3>אין עדיין מועדפים</h3><p>לחיצה על הכוכב בכרטיס מוסיפה מילה לכאן,<br>כדי לחזור אליה מאוחר יותר.</p></div>'
      : '<div class="empty"><div class="big">⌕</div><h3>אין תוצאות</h3><p>אפשר לחפש בערבית, בעברית או בתעתיק.<br>החיפוש מוצא גם צורות נטויות של פעלים — נסו ״بيفتح״.</p></div>';
    return;
  }
  page();
}

function page(){
  const btn = resultsEl.querySelector('.load-more');
  if(btn) btn.remove();

  const frag = document.createDocumentFragment();
  list.slice(shown, shown + PAGE).forEach(w => frag.appendChild(card(w)));
  resultsEl.appendChild(frag);
  shown = Math.min(shown + PAGE, list.length);

  statsEl.textContent = shown === list.length
    ? `${list.length} מתוך ${DICTIONARY.length} ערכים`
    : `${shown} מתוך ${list.length} תוצאות`;

  if(shown < list.length){
    const b = document.createElement('button');
    b.className = 'load-more';
    b.textContent = `הצגת ${Math.min(PAGE, list.length - shown)} נוספים · ${list.length - shown} נותרו`;
    b.onclick = page;
    resultsEl.appendChild(b);
  }
}

function tableHTML(rows){
  return `<div class="grid">${rows.map(c => `
    <div class="cell"><span class="p">${esc(c.p)}</span>
      <span class="f"><span class="a arabic" lang="ar">${esc(c.ar)}</span><span class="t">${esc(c.tr)}</span></span>
    </div>`).join('')}</div>`;
}

function card(w){
  const via = matchInfo(w, q).via;
  const rel = related(w);
  const isFav = favs.has(w.ar);
  const uid = 'entry-' + DICTIONARY.indexOf(w);
  const el = document.createElement('article');
  el.className = 'card';

  const tenses = [];
  if(w.conj) tenses.push(['עבר', w.conj]);
  if(w.pres) tenses.push(['הווה', w.pres]);
  if(w.imp)  tenses.push(['ציווי', w.imp]);

  el.innerHTML = `
    <div class="summary">
      <button class="head" type="button" aria-expanded="false" aria-controls="${uid}-body">
        <div class="top"><div class="word arabic" lang="ar">${esc(w.ar)}</div></div>
        <div class="bridge"><span class="tr">${esc(w.tr)}</span><span class="rule"></span></div>
        <div class="gloss">${esc(w.he)}</div>
        <div class="tags">
          <span class="tag">${esc(w.cat)}</span>
          ${tenses.length ? '<span class="tag verb">נטייה מלאה</span>' : ''}
          ${via ? `<span class="tag via">${esc(via.l)} · <b class="arabic" lang="ar">${esc(via.t)}</b></span>` : ''}
        </div>
        <span class="caret" aria-hidden="true">▼</span>
      </button>
      <button class="star${isFav ? ' on' : ''}" type="button"
              aria-label="${isFav ? 'הסרה מהמועדפים' : 'הוספה למועדפים'}"
              aria-pressed="${isFav ? 'true' : 'false'}">${isFav ? '★' : '☆'}</button>
    </div>
    <div class="body" id="${uid}-body" hidden>
      ${(w.ex || []).length ? `<div class="sec"><div class="sec-label">בשימוש</div>
        ${w.ex.map(e => `<div class="ex"><div class="a arabic" lang="ar">${esc(e.ar)}</div><div class="h">${esc(e.he)}</div></div>`).join('')}
      </div>` : ''}

      ${tenses.length ? `<div class="sec"><div class="sec-label">נטייה</div>
        <div class="tabs" role="tablist" aria-label="זמן הנטייה">${tenses.map((t,i) => `<button class="tab${i ? '' : ' on'}" type="button" role="tab" aria-selected="${i ? 'false' : 'true'}" tabindex="${i ? '-1' : '0'}" data-tab="${i}">${t[0]}</button>`).join('')}</div>
        ${tenses.map((t,i) => `<div class="pane${i ? '' : ' on'}" role="tabpanel" data-pane="${i}"${i ? ' hidden' : ''}>${tableHTML(t[1])}</div>`).join('')}
      </div>` : ''}

      ${rel.list.length ? `<div class="sec">
        <div class="sec-label">מאותו שורש <span class="root-key arabic">${esc(rel.root)}</span></div>
        <div class="roots">${rel.list.map(x => `
          <button class="root" type="button" data-jump="${esc(x.ar)}">
            <span class="a arabic" lang="ar">${esc(x.ar)}</span>
            <span class="h">${esc(x.he.split(/[,\/]/)[0].trim())}</span>
          </button>`).join('')}</div>
      </div>` : ''}

      <div class="acts">
        <button class="act primary speak" type="button">השמעת המילה</button>
        <a class="act" target="_blank" rel="noopener noreferrer" href="https://youglish.com/pronounce/${encodeURIComponent(w.ar)}/arabic">YouGlish</a>
        <a class="act" target="_blank" rel="noopener" href="https://forvo.com/word/${encodeURIComponent(w.ar)}/">Forvo</a>
      </div>
    </div>`;

  const head = el.querySelector('.head');
  const star = el.querySelector('.star');

  const toggleFav = e => {
    e.stopPropagation(); e.preventDefault();
    if(favs.has(w.ar)){ favs.delete(w.ar); star.textContent = '☆'; star.classList.remove('on'); }
    else               { favs.add(w.ar);    star.textContent = '★'; star.classList.add('on'); }
    star.setAttribute('aria-label', favs.has(w.ar) ? 'הסרה מהמועדפים' : 'הוספה למועדפים');
    star.setAttribute('aria-pressed', favs.has(w.ar) ? 'true' : 'false');
    saveFavs();
    renderFilters();
    if(activeCat === '★') render();
  };
  star.addEventListener('click', toggleFav);

  head.onclick = () => {
    const open = el.classList.toggle('open');
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    el.querySelector('.body').hidden = !open;
  };

  el.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      const i = tab.dataset.tab;
      el.querySelectorAll('.tab').forEach(t => {
        const selected = t === tab;
        t.classList.toggle('on', selected);
        t.setAttribute('aria-selected', selected ? 'true' : 'false');
        t.tabIndex = selected ? 0 : -1;
      });
      el.querySelectorAll('.pane').forEach(p => {
        const selected = p.dataset.pane === i;
        p.classList.toggle('on', selected);
        p.hidden = !selected;
      });
    };
  });

  el.querySelectorAll('.root').forEach(b => {
    b.onclick = () => {
      activeCat = null; searchEl.value = b.dataset.jump;
      renderFilters(); render();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });

  el.querySelector('.speak').onclick = () => {
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(w.ar);
    u.lang = 'ar'; speechSynthesis.cancel(); speechSynthesis.speak(u);
  };

  return el;
}

/* ===== אירועים ===== */
let timer = null;
searchEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 150); });
$('clear-btn').onclick = () => { searchEl.value = ''; render(); searchEl.focus(); };
addEventListener('scroll', () => searchbar.classList.toggle('stuck', scrollY > 8), {passive:true});

const filterPanel = $('filter-panel');
const filterBackdrop = $('filter-backdrop');
const filterBtn = $('filter-btn');

function openFilters(){
  if(!matchMedia('(max-width:760px)').matches){
    filterPanel.querySelector('.chip')?.focus();
    return;
  }
  filterPanel.classList.add('show');
  filterBackdrop.hidden = false;
  requestAnimationFrame(() => filterBackdrop.classList.add('show'));
  filterBtn.setAttribute('aria-expanded','true');
  document.body.classList.add('filters-open');
  $('close-filters').focus();
}
function closeFilters(){
  filterPanel.classList.remove('show');
  filterBackdrop.classList.remove('show');
  filterBtn.setAttribute('aria-expanded','false');
  document.body.classList.remove('filters-open');
  setTimeout(() => { if(!filterBackdrop.classList.contains('show')) filterBackdrop.hidden = true; }, 230);
}
filterBtn.onclick = openFilters;
$('close-filters').onclick = closeFilters;
filterBackdrop.onclick = closeFilters;
addEventListener('keydown', e => { if(e.key === 'Escape') closeFilters(); });

$('fav-btn').onclick = () => {
  activeCat = activeCat === '★' ? null : '★';
  renderFilters(); render(); closeFilters();
};

$('sub').textContent = `להג פלסטיני ↔ עברית · ${DICTIONARY.length.toLocaleString('he-IL')} ערכים`;
renderFilters();
render();

/* ===== התקנה כאפליקציה ===== */
const installBtn = $('install-btn');
let installPrompt = null;

// כבר רץ כאפליקציה מותקנת? אז אין מה להציע.
const isStandalone = () => {
  try {
    if(navigator.standalone === true) return true;
    if(!window.matchMedia) return false;
    return matchMedia('(display-mode: standalone)').matches ||
           matchMedia('(display-mode: minimal-ui)').matches;
  } catch(e){ return false; }
};

// המשתמש כבר התקין או דחה בעבר - לא מציקים שוב.
const installDone = () => { try { return localStorage.getItem('installed') === '1'; } catch(e){ return false; } };
const markInstalled = () => { try { localStorage.setItem('installed','1'); } catch(e){} };

addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  if(isStandalone() || installDone()) return;   // מותקן כבר - הכפתור נשאר מוסתר
  installPrompt = event;
  installBtn.hidden = false;
});

installBtn.onclick = async () => {
  if(!installPrompt) return;
  installBtn.hidden = true;
  await installPrompt.prompt();
  const choice = await installPrompt.userChoice;
  if(choice && choice.outcome === 'accepted') markInstalled();
  installPrompt = null;
};

addEventListener('appinstalled', () => {
  installPrompt = null;
  installBtn.hidden = true;
  markInstalled();
});

// אם נפתח ישירות במצב אפליקציה - לסמן ולהסתיר מיד
if(isStandalone()){ markInstalled(); installBtn.hidden = true; }

/* ===== Service Worker — אופליין ועדכונים =====
   רץ רק מ-https:// או localhost. מ-file:// מדולג, והאפליקציה עובדת רגיל. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => {
    // האם כבר היה SW ששולט בעמוד? אם לא, זו התקנה ראשונה ואסור לרענן.
    const hadController = !!navigator.serviceWorker.controller;
    let refreshed = false;

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(!hadController || refreshed) return;   // התקנה ראשונה, או שכבר רועננו
      refreshed = true;
      location.reload();
    });

    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .then(reg => {
        // אם נתקע worker במצב המתנה מגרסה קודמת - לשחרר אותו
        if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
      })
      .catch(() => {});
  });
}
})();
</script>
